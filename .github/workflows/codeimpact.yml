# CodeImpact reviews its own pull requests.
#
# Two jobs, so repository code never runs next to a write token:
# - analyze: checks out the PR head, installs dependencies, runs type checks and impacted tests.
#   It has `contents: read` only.
# - comment: holds `pull-requests: write`. It checks out only the comment action from the base
#   commit (never the PR's version of it) and renders the report artifact as untrusted input.
name: CodeImpact

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: codeimpact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./actions/analyze
        with:
          install-command: npm ci --no-audit --no-fund
          typecheck: true
          run-tests: true

  comment:
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: actions/comment
          persist-credentials: false
      - uses: ./actions/comment
        with:
          fail-on-high: false
