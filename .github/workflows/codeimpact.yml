# CodeImpact reviews its own pull requests, using the released v0.1.0 actions.
#
# Two jobs, so repository code never runs next to a write token:
# - analyze: checks out the PR head, installs dependencies, runs type checks and impacted tests.
#   It has `contents: read` only.
# - comment: holds `pull-requests: write`. It never checks out the repository; it runs the
#   pinned comment action and renders the report artifact as untrusted input. Because the
#   actions come from a tag, a pull request cannot change the code that holds the write token.
name: CodeImpact

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: codeimpact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Haider425/codeImpact/actions/analyze@v0.1.0
        with:
          install-command: npm ci --no-audit --no-fund
          typecheck: true
          run-tests: true

  comment:
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: Haider425/codeImpact/actions/comment@v0.1.0
        with:
          fail-on-high: false
